# brAIn settings
# ==============
# This file is committed, so everyone who uses this repository (you, or your whole team) gets the
# same settings. Change a value and commit it. Delete a line to get its default (shown below).
# A mistake, like a typo or a number out of range, stops brAIn with a message that says what to fix.
# After changing settings, restart your AI assistant.
# Run `uv run rag sync` to apply changes that affect indexing; search never rebuilds the index.


# ---- What is searched -------------------------------------------------------------------------

# The remote branch to index. Sync uses its last fetched/pushed commit, whichever local branch
# you have checked out. Search reads the last synced snapshot. Unpushed commits are never indexed.
# Use "master" or "trunk" if that is what your branch is called.
branch = "main"

# The Git remote that holds the published notes. Fetch/pull after other people push changes.
remote = "origin"

# Folders inside notes/ that are not searched, such as old or unfinished notes.
# Example: ["archive", "drafts"] skips notes/archive/ and notes/drafts/.
# Folders that start with a dot, like .trash, are always skipped.
skip_folders = []

# Sections under these headings are not searched, because they only add noise.
skip_headings = ["References", "Table of Contents", "TOC"]


# ---- What a search returns --------------------------------------------------------------------

# The most passages one search returns (1 to 50).
# Raise it to give your AI assistant more context. Lower it to save its tokens.
max_results = 10

# How close to the best match a passage must be to be returned (above 0, up to 1).
# Lower is stricter: fewer passages, all very relevant. Higher lets more passages through.
score_margin = 0.10


# ---- How notes are cut into passages ----------------------------------------------------------
# Each note is cut along its headings. These two numbers are in characters. The defaults suit most
# notes. Changing them rebuilds the index on the next sync.

# A section longer than this is split into more passages (500 to 8000).
max_chunk_size = 1000

# A section shorter than this is joined to its neighbour (1 up to half of max_chunk_size).
min_chunk_size = 150
