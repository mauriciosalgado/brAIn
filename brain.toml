# Team settings for brAIn. This file is committed, so every developer, the git hooks and the MCP
# server read the same values. Delete a line to get its default (shown here).
#
# After changing a setting, nothing else to do: it is read every time brAIn runs, and the notes
# are re-indexed by themselves when a change needs it.

# The branch your team merges notes into. Only this branch is searched, whichever branch you have
# checked out: a note becomes searchable once it is merged here.
# One person can override it with the BRAIN_BRANCH environment variable.
branch = "main"

# Sections under these headings are not searched (they only add noise).
skip_headings = ["References", "Table of Contents", "TOC"]

# The most passages one search returns (1 to 50). A search returns fewer when the rest match much
# worse than the best one. More gives an assistant more context and costs it more tokens.
max_results = 10

# How close to the best match a passage must be to be returned (above 0, up to 1). Smaller is
# stricter: fewer, more precise passages. Larger lets more through.
score_margin = 0.10

# A note is cut into passages along its headings. A section longer than max_chunk_size characters
# is split further (500 to 8000). A section shorter than min_chunk_size joins its neighbour
# (1 up to half of max_chunk_size). The defaults suit most notes. Changing either re-indexes.
max_chunk_size = 1000
min_chunk_size = 150
