[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastembed>=0.6.0",
    "fastmcp>=3.0,<4",
    "filelock>=3.25.1",
    "lancedb>=0.41,<1",
    "markdown-it-py>=4.0.0",
    "pyarrow>=14",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ty>=0.0.99",
]

[project.scripts]
rag = "rag.cli:main"
rag-mcp = "rag.mcp.server:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "C4", "UP", "RUF", "PL", "PERF", "FURB", "N"]
ignore = [
    "PLR2004",  # magic numbers are fine in tests and thresholds
]

[tool.ruff.lint.per-file-ignores]
"rag/cli.py" = ["PLC0415"]  # defer only CLI engine imports so help stays lightweight

[tool.pytest.ini_options]
testpaths = ["tests"]
