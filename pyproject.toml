[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "chromadb>=0.4.0",
    "fastembed>=0.4.0",
    "fastmcp>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag = "rag.cli:main"
rag-mcp = "rag.mcp.server:main"
